# Notifications driven by the appliance_ml integration events.
# Example: replace notify.notify with your own notify service (e.g. notify.mobile_app_<phone>).
automation:
  - id: appliance_ml_finished_notify
    alias: "Appliance finished (ML)"
    mode: queued
    triggers:
      - trigger: event
        event_type: appliance_ml_cycle_finished
    actions:
      - action: notify.notify
        data:
          title: "{{ trigger.event.data.entry }} finished"
          message: >-
            {{ trigger.event.data.program }} · {{ trigger.event.data.duration_min }} Min ·
            {{ trigger.event.data.energy_kwh }} kWh
