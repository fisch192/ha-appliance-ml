name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tests/test_engine.py
      - run: python tests/test_appliances.py
      - run: python tests/test_estimator.py
      - run: python tests/test_monitor.py
      - run: node --check custom_components/appliance_ml/frontend/appliance-ml-panel.js
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend
      - run: pytest tests/ha -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with: {category: integration}
